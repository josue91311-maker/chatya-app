version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: chatya-db
    environment:
      POSTGRES_USER: chatya
      POSTGRES_PASSWORD: chatya_password
      POSTGRES_DB: chatya
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatya"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chatya-backend
    environment:
      DATABASE_URL: postgresql://chatya:chatya_password@db:5432/chatya
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production-min-32-chars}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      DEBUG: "false"
    volumes:
      - ./backend/uploads:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python seed_data.py &&
             uvicorn main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chatya-frontend
    environment:
      NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:8000/api/v1}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
